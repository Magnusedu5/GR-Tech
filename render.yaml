services:

  # ── Django backend ────────────────────────────────────────
  - type: web
    name: grtech-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py shell -c "from django.contrib.auth import get_user_model; U=get_user_model(); u,_=U.objects.get_or_create(username='magnus'); u.set_password('Mag123456789@'); u.email='magnusedu5@gmail.com'; u.is_staff=True; u.is_superuser=True; u.first_name='Magnus'; u.last_name='Edu'; u.save(); print('Admin ready')"
    startCommand: gunicorn grtech_backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: grtech-backend.onrender.com
      - key: FRONTEND_URL
        value: https://grtech-site.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: grtech-db
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_EMAIL
        sync: false

  # ── PostgreSQL database ───────────────────────────────────
  databases:
    - name: grtech-db
      databaseName: grtech
      user: grtech

  # ── Static frontend ───────────────────────────────────────
  - type: web
    name: grtech-site
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /services
        destination: /services.html
      - type: rewrite
        source: /projects
        destination: /projects.html
      - type: rewrite
        source: /about
        destination: /about.html
      - type: rewrite
        source: /contact
        destination: /contact.html
      - type: rewrite
        source: /dashboard
        destination: /dashboard.html
      - type: rewrite
        source: /
        destination: /index.html
